<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        padding: 15px;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      h3 {
        margin-top: 0;
        color: #333;
        text-align: center;
      }
      label {
        font-size: 12px;
        font-weight: bold;
        color: #555;
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
      }
      textarea {
        resize: vertical;
        min-height: 100px;
        font-family: sans-serif;
      }
      button {
        width: 100%;
        padding: 12px;
        margin-top: 25px;
        background-color: #2c3e50;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        background-color: #34495e;
      }
      button:disabled {
        background-color: #95a5a6;
      }
      #status {
        text-align: center;
        margin-top: 10px;
        font-size: 13px;
        color: green;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>Daily Class Log</h3>

      <label>Date</label>
      <input type="date" id="dateInput">

      <label>Time Slot</label>
      <select id="timeSelect">
        <option value="">Loading time slots...</option>
      </select>

      <label>Class</label>
      <select id="classSelect">
        <option value="">Loading classes...</option>
      </select>

      <label>Status</label>
      <select id="statusSelect">
        <option value="">Loading statuses...</option>
      </select>

      <label>Activity Log / Notes</label>
      <textarea id="notesInput" placeholder="What did you cover today?"></textarea>

      <button id="saveBtn" onclick="submitLog()">SAVE ENTRY</button>
      <div id="status"></div>
    </div>

    <script>
      window.onload = function () {
        document.getElementById('dateInput').valueAsDate = new Date();

        google.script.run.withSuccessHandler(populateClasses).getClassList();
        google.script.run.withSuccessHandler(populateStatuses).getStatusList();
        google.script.run.withSuccessHandler(populateTimeSlots).getTimeSlotListFromTimetable();

        attachAutoFillHandlers();
      };

      function attachAutoFillHandlers() {
        document.getElementById('dateInput').addEventListener('change', autoSelectClassFromTimetable);
        document.getElementById('timeSelect').addEventListener('change', autoSelectClassFromTimetable);
      }

      function autoSelectClassFromTimetable() {
        const date = document.getElementById('dateInput').value;
        const timeSlot = document.getElementById('timeSelect').value;
        if (!date || !timeSlot) return;

        google.script.run.withSuccessHandler(function (result) {
          if (!result || !result.className) return;
          selectOrCreateOption('classSelect', result.className);
        }).getClassGroupFromTimetable(date, timeSlot);
      }

      function selectOrCreateOption(selectId, value) {
        const select = document.getElementById(selectId);
        const options = Array.from(select.options);
        const found = options.find((opt) => opt.value === value);

        if (found) {
          select.value = value;
          return;
        }

        const option = document.createElement('option');
        option.text = value;
        option.value = value;
        select.add(option);
        select.value = value;
      }

      function populateClasses(classes) {
        const select = document.getElementById('classSelect');
        select.innerHTML = '';

        const blank = document.createElement('option');
        blank.value = '';
        blank.text = 'Auto from timetable / select manually';
        select.add(blank);

        if (!classes || classes.length === 0) return;

        classes.forEach((c) => {
          const option = document.createElement('option');
          option.text = c;
          option.value = c;
          select.add(option);
        });
      }

      function populateStatuses(statuses) {
        const select = document.getElementById('statusSelect');
        select.innerHTML = '';

        if (!statuses || statuses.length === 0) {
          const fallback = document.createElement('option');
          fallback.value = 'Planned';
          fallback.text = 'Planned';
          select.add(fallback);
          select.value = 'Planned';
          return;
        }

        statuses.forEach((s) => {
          const option = document.createElement('option');
          option.text = s;
          option.value = s;
          select.add(option);
        });

        select.value = 'Planned';
      }

      function populateTimeSlots(timeSlots) {
        const select = document.getElementById('timeSelect');
        select.innerHTML = '';

        if (!timeSlots || timeSlots.length === 0) {
          const blank = document.createElement('option');
          blank.value = '';
          blank.text = 'No time slots found in Timetable A2:B10';
          select.add(blank);
          return;
        }

        timeSlots.forEach((slot) => {
          const option = document.createElement('option');
          option.text = slot;
          option.value = slot;
          select.add(option);
        });

        autoSelectClassFromTimetable();
      }

      function submitLog() {
        const btn = document.getElementById('saveBtn');
        const status = document.getElementById('status');

        const logData = {
          date: document.getElementById('dateInput').value,
          timeSlot: document.getElementById('timeSelect').value,
          className: document.getElementById('classSelect').value,
          status: document.getElementById('statusSelect').value,
          notes: document.getElementById('notesInput').value
        };

        if (!logData.timeSlot) {
          status.style.color = 'red';
          status.innerText = 'Please select a time slot.';
          return;
        }

        if (!logData.notes) {
          status.style.color = 'red';
          status.innerText = 'Please write a note before saving.';
          return;
        }

        btn.disabled = true;
        btn.innerText = 'Saving...';
        status.innerText = '';

        google.script.run.withSuccessHandler(function (response) {
          btn.disabled = false;
          btn.innerText = 'SAVE ENTRY';
          status.style.color = 'green';

          const message = response && response.message ? response.message : response;
          status.innerText = message || 'Saved.';
          document.getElementById('notesInput').value = '';

          autoSelectClassFromTimetable();
        }).saveLog(logData);
      }
    </script>
  </body>
</html>
